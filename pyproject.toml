[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denet"
version = "0.1.0"
description = "DENet: Detection-Enhancement Network for object detection under adverse weather"
requires-python = ">=3.9"
dependencies = [
    "torch>=1.13.1,<3",
    # constrain numpy only in full installation due to unused in core
    # "numpy>=1.24,<3",
    "opencv-python>=4.2,<5",
]

[project.optional-dependencies]
# NOTE: the lower bound of requirements are based on original env (python=3.7 instead of 3.9).
full = [
    "torch==1.13.1",
    "torchvision==0.14.1",
    # only torch>=2.3 supports numpy 2: https://github.com/pytorch/pytorch/issues/107302
    "numpy<2",
    "tensorboard>=2.5,<3",
    "PyYAML>=5.1,<6",
    "pytz",
    "scikit-learn>=0.21,<1",
    "scipy>=1.5,<2",
    "thop<1",
    "tqdm<5",
    "matplotlib>=3.1,<4",
]

[tool.setuptools.packages.find]
include = ["denet*"]
